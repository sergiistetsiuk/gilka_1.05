; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-zero

[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_src_filter = +<main.cpp>

monitor_speed = 115200

; ESP32-S3FH4R2 = 4 MB Flash
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = qio

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

; Temporary display-only test. Does not read or write Wi-Fi/OLED preferences.
[env:oled-diagnostic]
extends = env:esp32-s3-zero
build_src_filter = +<oled_diagnostic.cpp>

; Check whether the panel needs a native 32-row scan and framebuffer.
[env:oled-diagnostic-32]
extends = env:esp32-s3-zero
build_src_filter = +<oled_diagnostic_32.cpp>
